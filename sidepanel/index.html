<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>
  <body>
    <header class="header">
      <div class="header-left">
        <button id="header-new" class="header-new" title="新对话">+ 新对话</button>
      </div>
      <div class="header-right">
        <div id="status" class="status">未配置</div>
        <div id="menu-wrap" class="menu-wrap">
          <button id="menu-toggle" class="icon-btn" title="菜单">⋮</button>
          <div id="menu" class="menu" hidden>
            <button id="menu-settings" class="menu-item">设置</button>
            <button id="menu-history" class="menu-item">历史对话</button>
          </div>
        </div>
      </div>
    </header>

    <section id="history" class="history" hidden>
      <div class="history-head">
        <span>历史对话</span>
        <button id="history-new" class="secondary small">新对话</button>
      </div>
      <div id="history-list" class="history-list"></div>
    </section>

    <section id="settings" class="settings" hidden>
      <label>提供商
        <select id="provider"></select>
      </label>
      <label>API Key
        <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
      </label>
      <label>Base URL
        <input id="base-url" placeholder="https://api.openai.com/v1" />
      </label>
      <label>Model
        <input id="model" placeholder="gpt-4o-mini" list="model-list" />
        <datalist id="model-list"></datalist>
      </label>
      <label>最大操作次数
        <input id="max-iterations" type="number" min="1" placeholder="20" />
      </label>
      <label>页面状态字符上限
        <input id="max-state-chars" type="number" min="100" placeholder="6000" />
      </label>
      <label>显示思考过程
        <select id="show-thinking">
          <option value="false">否</option>
          <option value="true">是</option>
        </select>
      </label>
      <div class="settings-actions">
        <button id="settings-save" class="primary">保存</button>
        <button id="settings-cancel" class="secondary">取消</button>
        <div id="settings-msg" class="settings-msg" hidden></div>
      </div>
    </section>

    <main id="messages" class="messages"></main>

    <form id="chat-form" class="chat-form">
      <div id="chat-title" class="chat-title" hidden></div>
      <div id="thinking" class="thinking" hidden>
        <span class="spinner"></span>
        <span>Thinking…</span>
      </div>
      <textarea
        id="input"
        placeholder="输入内容"
        rows="3"
      ></textarea>
      <div class="chat-actions">
        <button id="send" type="submit" class="primary" disabled>发送</button>
        <button id="stop" type="button" class="secondary" hidden>停止</button>
      </div>
    </form>

    <div id="balance" class="balance" hidden></div>
    <div id="tokens" class="tokens"><span id="tokens-current">0</span> tokens · <span id="tokens-k">0K</span></div>

    <script src="index.js" type="module"></script>
  </body>
</html>
