<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="index.css" />
  </head>
  <body>
    <header class="header">
      <h1>PlayAgent</h1>
      <div id="status" class="status">未连接</div>
    </header>

    <main id="messages" class="messages"></main>

    <form id="chat-form" class="chat-form">
      <textarea
        id="input"
        placeholder="描述任务，例如：打开百度搜索「playwright」，返回第一条结果标题"
        rows="3"
      ></textarea>
      <div class="chat-actions">
        <button id="send" type="submit" class="primary" disabled>发送</button>
        <button id="stop" type="button" class="secondary" hidden>停止</button>
      </div>
    </form>

    <script src="index.js" type="module"></script>
  </body>
</html>
